name: Update README Stats

on:
  schedule:
    - cron: "0 0 * * *"  # Daily at midnight UTC
  workflow_dispatch:  # Manual trigger
  push:
    paths: [tools/ink_stats.py, .github/workflows/stats.yml]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      # one paper card (GitHub numbers + WakaTime languages) drawn to match the banner
      - name: Draw ink stats card
        run: python tools/ink_stats.py
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/ink-stats.svg
          git commit -m "Update README stats" || exit 0
          git push
