name: Ink snake

on:
  schedule:
    - cron: "0 6 * * *"  # Daily
  workflow_dispatch:
  push:
    paths: [.github/workflows/snake.yml]

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # contribution grid as ink on paper: empty days are paper, busy days are black ink, the snake is the vermilion seal
      - uses: Platane/snk@v3
        with:
          github_user_name: phoenixak
          outputs: |
            dist/ink-snake.svg?color_snake=%23C2341B&color_dots=%23E4DED1,%23C9C2B3,%238F887A,%234A463F,%23141310

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
