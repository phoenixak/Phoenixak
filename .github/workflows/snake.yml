name: Ink snake

on:
  schedule:
    - cron: "0 6 * * *"  # Daily
  workflow_dispatch:
  push:
    paths: [.github/workflows/snake.yml, tools/paper_snake.py]

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # contribution grid as ink on paper: quiet days are paper, busier days darker ink,
      # the busiest are vermilion; the snake is a brush stroke of black ink
      - uses: Platane/snk@v3
        with:
          github_user_name: phoenixak
          outputs: |
            dist/ink-snake.svg?color_snake=%23141310&color_dots=%23E6E0D3,%23B9B1A1,%236E685D,%232A2722,%23C2341B

      - name: Mount it on a paper card
        run: |
          sudo chown -R "$(id -u)" dist  # snk runs in Docker as root
          python tools/paper_snake.py dist/ink-snake.svg

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
